<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gesture Xmas Tree V13: Mobile Fix</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 85%);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            /* 禁止手机双击缩放 */
            touch-action: none; 
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ui-hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 1.5rem; /* 手机上字体改小一点 */
            margin: 0;
            letter-spacing: 3px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            font-weight: 300;
            text-transform: uppercase;
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid #d4af37;
            padding: 8px 12px;
            backdrop-filter: blur(4px);
            width: fit-content;
        }

        .status-item { font-size: 0.7rem; color: #ccc; margin-bottom: 2px; }
        .status-value { color: #fff; font-weight: bold; font-size: 0.9rem; }
        
        #zoom-container { margin-top: 8px; opacity: 0; transition: opacity 0.5s; }
        #zoom-bar-bg { width: 120px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        #zoom-bar { height: 100%; width: 0%; background: #d4af37; transition: width 0.1s; }

        .controls { pointer-events: auto; }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #d4af37;
            padding: 10px 20px;
            text-align: center;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: fit-content;
        }
        .file-upload-btn input[type=file] {
            position: absolute; top: 0; right: 0; min-width: 100%; min-height: 100%;
            font-size: 100px; opacity: 0; cursor: pointer;
        }

        /* 手机上摄像头画面不需要翻转，也不需要显示 */
        #video-input {
            position: absolute;
            bottom: 10px; right: 10px;
            width: 120px; height: 90px;
            z-index: 2;
            opacity: 0; /* 隐藏视频框，但保留DOM */
            pointer-events: none; 
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            font-size: 1rem;
            letter-spacing: 4px;
            color: #d4af37;
            text-align: center;
            width: 80%;
            line-height: 1.5;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .gesture-guide {
            margin-top: 10px;
            font-size: 0.6rem;
            color: #888;
            line-height: 1.5;
            max-width: 200px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }
        
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">STARTING CAMERA...<br><span style="font-size:0.8rem; color:#888;">Please Allow Camera Access</span></div>

    <div id="ui-layer">
        <h1>XMAS V13</h1>
        
        <div class="status-panel">
            <div class="status-item">STATE: <span id="state-display" class="status-value">TREE</span></div>
            <div id="zoom-container">
                <div class="status-item">ZOOM</div>
                <div id="zoom-bar-bg"><div id="zoom-bar"></div></div>
            </div>
        </div>

        <div class="controls">
            <div class="file-upload-btn">
                <span>+ Upload</span>
                <input type="file" id="photo-upload" accept="image/*" multiple>
            </div>
        </div>

        <div class="gesture-guide">
            👊 <strong>Fist</strong>: Tree<br>
            🖐 <strong>Open</strong>: Scatter<br>
            &nbsp;&nbsp;↳ Zoom: Move Hand<br>
            👌 <strong>Pinch</strong>: Photo
        </div>
    </div>

    <video id="video-input" playsinline webkit-playsinline muted autoplay></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Config ---
        const CONFIG = {
            particleCount: 2500, // 手机上稍微降低一点数量以保证流畅
            treeHeight: 35, treeRadius: 14, trunkHeight: 12, trunkRadius: 2,
            colors: {
                leaf: new THREE.Color(0x44ff44), 
                trunk: new THREE.Color(0x4a3c31),
                gold: new THREE.Color(0xffd700),
                red: new THREE.Color(0xff0033),
            },
            states: { TREE: 'TREE', SCATTER: 'SCATTER', ZOOM: 'ZOOM' }
        };

        let scene, camera, renderer, composer;
        let particles = [], photos = [];
        let dummy = new THREE.Object3D();
        let meshLeaves, meshTrunk, meshGold, meshRed, meshSticks;

        let currentState = CONFIG.states.TREE;
        const CAMERA_DEFAULT_Z = 85; 
        let targetCameraZ = CAMERA_DEFAULT_Z;
        
        let time = 0;
        let activePhotoIndex = -1;
        let handRotationTarget = { x: 0, y: 0 };
        const clock = new THREE.Clock(); 

        init();
        initMediaPipe();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, targetCameraZ);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 手机DPR通常很高（3.0），强制限制为 1.5 或 2.0 提升性能
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping; 
            renderer.toneMappingExposure = 1.6; 
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);
            const keyLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            keyLight.position.set(15, 30, 30);
            scene.add(keyLight);
            const rimLight = new THREE.SpotLight(0x4455ff, 600);
            rimLight.position.set(0, 20, -40);
            rimLight.lookAt(0, 10, 0);
            scene.add(rimLight);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.3; bloomPass.strength = 1.2; bloomPass.radius = 0.6;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createParticles();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('photo-upload').addEventListener('change', handlePhotoUpload);
        }

        function createParticles() {
            // Geometries
            const leafGeo = new THREE.SphereGeometry(0.08, 6, 6); // 降低多边形
            const trunkGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.4, 6);
            const goldGeo = new THREE.SphereGeometry(0.2, 12, 12);
            const cubeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const stickGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 6);

            const matLeaf = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.leaf, roughness: 0.6, metalness: 0.2,
                emissive: CONFIG.colors.leaf, emissiveIntensity: 0.3
            });
            const matTrunk = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.trunk, roughness: 0.9
            });
            const matGold = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gold, metalness: 0.9, roughness: 0.1,
                emissive: CONFIG.colors.gold, emissiveIntensity: 0.8
            });
            const matRed = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.red, roughness: 0.2,
                emissive: CONFIG.colors.red, emissiveIntensity: 0.4
            });

            const countTrunk = 500; const countGold = 100; const countRed = 50; const countStick = 40; 
            const countLeaf = CONFIG.particleCount - countTrunk - countGold - countRed - countStick;

            meshLeaves = new THREE.InstancedMesh(leafGeo, matLeaf, countLeaf);
            meshTrunk = new THREE.InstancedMesh(trunkGeo, matTrunk, countTrunk);
            meshGold = new THREE.InstancedMesh(goldGeo, matGold, countGold);
            meshRed = new THREE.InstancedMesh(cubeGeo, matRed, countRed);
            meshSticks = new THREE.InstancedMesh(stickGeo, matRed, countStick);

            scene.add(meshLeaves); scene.add(meshTrunk); scene.add(meshGold); scene.add(meshRed); scene.add(meshSticks);

            let globalIdx = 0;
            const setupParticle = (mesh, count, type) => {
                for (let i = 0; i < count; i++) {
                    const idx = globalIdx++;
                    let treePos = new THREE.Vector3();
                    let rot = new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0);

                    if (type === 'trunk') {
                        const h = Math.random() * CONFIG.trunkHeight + 2; 
                        const r = Math.random() * CONFIG.trunkRadius;
                        const angle = Math.random() * Math.PI * 2;
                        treePos.set(Math.cos(angle) * r, h - CONFIG.treeHeight / 2, Math.sin(angle) * r);
                        rot.set(0,0,0);
                    } else {
                        const h = Math.random() * CONFIG.treeHeight;
                        const maxR = (1 - h / CONFIG.treeHeight) * CONFIG.treeRadius;
                        let r = maxR * Math.sqrt(Math.random());
                        if (type !== 'leaf') r = maxR * (0.8 + Math.random() * 0.2);
                        const angle = Math.random() * Math.PI * 2;
                        treePos.set(Math.cos(angle) * r, h - CONFIG.treeHeight / 2, Math.sin(angle) * r);
                    }
                    const scatterPos = new THREE.Vector3((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 40);
                    particles.push({ mesh, instanceId: i, pos: treePos.clone(), targetTree: treePos, targetScatter: scatterPos, initialRot: rot, type });
                    dummy.position.copy(treePos); dummy.rotation.copy(rot); dummy.scale.setScalar(1); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
                }
            };
            setupParticle(meshLeaves, countLeaf, 'leaf'); setupParticle(meshTrunk, countTrunk, 'trunk');
            setupParticle(meshGold, countGold, 'gold'); setupParticle(meshRed, countRed, 'red'); setupParticle(meshSticks, countStick, 'stick');
        }

        function handlePhotoUpload(e) {
             const files = e.target.files; if (!files.length) return; photos.forEach(p => scene.remove(p.mesh)); photos = [];
            Array.from(files).forEach(file => { const reader = new FileReader(); reader.onload = (evt) => { const img = new Image(); img.src = evt.target.result; img.onload = () => { const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true; const ar = img.width / img.height; const geo = new THREE.PlaneGeometry(5 * ar, 5); const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }); const mesh = new THREE.Mesh(geo, mat); const bGeo = new THREE.PlaneGeometry(5 * ar + 0.3, 5 + 0.3); const bMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); const border = new THREE.Mesh(bGeo, bMat); border.position.z = -0.02; mesh.add(border); const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight/2 + 5; const r = ((1 - (h + CONFIG.treeHeight/2) / CONFIG.treeHeight) * CONFIG.treeRadius) + 4; const angle = Math.random() * Math.PI * 2; const pos = new THREE.Vector3(Math.cos(angle)*r, h, Math.sin(angle)*r); mesh.position.copy(pos); mesh.lookAt(0, h, 0); scene.add(mesh); photos.push({ mesh: mesh, targetTree: pos, targetScatter: new THREE.Vector3((Math.random()-0.5)*80, (Math.random()-0.5)*60, 0) }); } }; reader.readAsDataURL(file); });
        }

        function initMediaPipe() {
            const video = document.getElementById('video-input');
            const loading = document.getElementById('loading');
            
            // 使用 CDN
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({ 
                maxNumHands: 1, 
                modelComplexity: 0, // 0 = Lite (快), 1 = Full (准). 手机上用 0 更好
                minDetectionConfidence: 0.5, 
                minTrackingConfidence: 0.5 
            });
            
            hands.onResults(onHandsResults);
            
            const cam = new Camera(video, { 
                onFrame: async () => { 
                    try {
                        await hands.send({image: video});
                    } catch(e) {
                        console.log("MP Error:", e);
                    }
                }, 
                width: 640, height: 480,
                facingMode: 'user' // 强制前置摄像头
            });
            
            cam.start()
                .then(() => { 
                    loading.style.display = 'none'; 
                })
                .catch(err => {
                    loading.innerHTML = "CAMERA ERROR:<br>" + err.message + "<br><br>Please try opening in Safari/Chrome.";
                    loading.style.color = "red";
                });
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                detectGesture(lm);

                if (currentState === CONFIG.states.SCATTER) {
                    handRotationTarget.x = (lm[0].x - 0.5) * 4;
                    handRotationTarget.y = (lm[0].y - 0.5) * 2;
                    
                    const handSize = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
                    const zoomFactor = Math.min(Math.max((handSize - 0.05) / 0.25, 0), 1);
                    document.getElementById('zoom-bar').style.width = (zoomFactor * 100) + '%';
                    targetCameraZ = 90 - (zoomFactor * 70); 
                } else if (currentState === CONFIG.states.TREE) {
                    targetCameraZ = CAMERA_DEFAULT_Z; 
                }
            } else {
                if (currentState === CONFIG.states.TREE) targetCameraZ = CAMERA_DEFAULT_Z;
                else if (currentState === CONFIG.states.SCATTER) {
                    targetCameraZ = 85; document.getElementById('zoom-bar').style.width = '0%';
                }
            }
        }

        function detectGesture(lm) {
            const dist = (i1, i2) => Math.hypot(lm[i1].x - lm[i2].x, lm[i1].y - lm[i2].y);
            const isOpen = (tip, base) => dist(tip, 0) > dist(base, 0);
            const fingersOpen = [8,12,16,20].every(i => isOpen(i, i-3));
            const pinch = dist(4, 8) < 0.05;
            const fist = !fingersOpen && !pinch;
            const prev = currentState;
            if (pinch) {
                if (currentState !== CONFIG.states.ZOOM && photos.length > 0) {
                    currentState = CONFIG.states.ZOOM; activePhotoIndex = (activePhotoIndex + 1) % photos.length;
                }
            } else if (fist) { currentState = CONFIG.states.TREE; } 
            else if (fingersOpen) { currentState = CONFIG.states.SCATTER; }

            if(prev !== currentState) {
                const elState = document.getElementById('state-display');
                const elZoomUI = document.getElementById('zoom-container');
                elState.innerText = currentState;
                elState.style.color = currentState === 'ZOOM' ? '#ff3333' : '#fff';
                elZoomUI.style.opacity = currentState === CONFIG.states.SCATTER ? '1' : '0';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            time += delta;

            camera.position.z = THREE.MathUtils.damp(camera.position.z, targetCameraZ, 5, delta);

            if (currentState === CONFIG.states.SCATTER) {
                scene.rotation.y = THREE.MathUtils.damp(scene.rotation.y, handRotationTarget.x, 3, delta);
                scene.rotation.x = THREE.MathUtils.damp(scene.rotation.x, handRotationTarget.y, 3, delta);
            } else {
                scene.rotation.y += 0.15 * delta; 
                scene.rotation.x = THREE.MathUtils.damp(scene.rotation.x, 0, 3, delta);
            }

            particles.forEach(p => {
                const target = currentState === CONFIG.states.TREE ? p.targetTree : p.targetScatter;
                
                p.pos.x = THREE.MathUtils.damp(p.pos.x, target.x, 3, delta);
                p.pos.y = THREE.MathUtils.damp(p.pos.y, target.y, 3, delta);
                p.pos.z = THREE.MathUtils.damp(p.pos.z, target.z, 3, delta);
                
                dummy.position.copy(p.pos);

                if (p.type === 'stick') {
                    dummy.rotation.set(p.initialRot.x + time, p.initialRot.y + time, p.initialRot.z);
                } else if (p.type === 'gold') {
                    const s = 1 + Math.sin(time * 3 + p.instanceId) * 0.2; 
                    dummy.scale.setScalar(s); dummy.rotation.copy(p.initialRot);
                } else if (p.type === 'trunk') {
                    dummy.rotation.copy(p.initialRot);
                    const targetScale = currentState === CONFIG.states.TREE ? 1 : 0.1;
                    const currentScale = dummy.scale.x;
                    const newScale = THREE.MathUtils.damp(currentScale, targetScale, 5, delta);
                    dummy.scale.setScalar(newScale);
                } else {
                    dummy.rotation.copy(p.initialRot); dummy.scale.setScalar(1);
                }
                dummy.updateMatrix(); p.mesh.setMatrixAt(p.instanceId, dummy.matrix);
            });

            meshLeaves.instanceMatrix.needsUpdate = true;
            meshTrunk.instanceMatrix.needsUpdate = true;
            meshGold.instanceMatrix.needsUpdate = true;
            meshRed.instanceMatrix.needsUpdate = true;
            meshSticks.instanceMatrix.needsUpdate = true;

            photos.forEach((photo, idx) => {
                const isFocus = (currentState === CONFIG.states.ZOOM && idx === activePhotoIndex);
                let tPos = new THREE.Vector3(); let tScale = 1;
                
                if (isFocus) {
                    tPos.set(0, 5, camera.position.z - 15); 
                    photo.mesh.lookAt(camera.position);
                    tScale = 3.5; photo.mesh.material.opacity = 1;
                } else {
                    tPos = currentState === CONFIG.states.TREE ? photo.targetTree : photo.targetScatter;
                    if(currentState === CONFIG.states.TREE) {
                         dummy.position.copy(tPos); dummy.lookAt(0, tPos.y, 0);
                         photo.mesh.rotation.set(dummy.rotation.x, dummy.rotation.y, dummy.rotation.z);
                    } else { photo.mesh.rotation.z += 0.5 * delta; }
                    photo.mesh.material.opacity = currentState === CONFIG.states.ZOOM ? 0.1 : 1;
                }
                
                photo.mesh.position.x = THREE.MathUtils.damp(photo.mesh.position.x, tPos.x, 4, delta);
                photo.mesh.position.y = THREE.MathUtils.damp(photo.mesh.position.y, tPos.y, 4, delta);
                photo.mesh.position.z = THREE.MathUtils.damp(photo.mesh.position.z, tPos.z, 4, delta);
                
                const s = photo.mesh.scale.x;
                const ns = THREE.MathUtils.damp(s, tScale, 4, delta);
                photo.mesh.scale.setScalar(ns);
            });
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
